name: "sdk_popup"
version: "1.6.0.0"
description: "Toast notification COM control for Clarion with its own WinForms notification forms (no DevExpress). Styles Default, Dark, Light, Rounded, Minimal, Touch. Displays popup/toast notifications with configurable message, title, duration, position, notification type, sound, opacity, pinned (sticky) mode, custom image sizing, and image-only floating notifications."
short_description: "Toast notification COM control for Clarion - no third-party UI library."
prog_id: "sdk_popup.sdk_popupControl"
assembly_name: "sdk_popup"
control_type: "standard"
ui_library: "WinForms"

repository:
  url: "https://github.com/Aarhusdk/sdk_popup"
  branch: "master"

author:
  name: "Jesper Laugesen"
  github: "Aarhusdk"

compatibility:
  dotnet: "net472"
  clarion:
    min_version: "11.0"
    tested_versions: ["11.0", "12.0"]

category: "UI Controls"
tags: ["popup", "notification", "alert", "toast", "sound", "image", "touch"]

changelog:
  - version: "1.6.0.0"
    date: "2026-10-13"
    changes: "DevExpress removed: all styles drawn by the control's own notification form. Title/Message COM properties, Touch style, notifications on the host control's monitor."
  - version: "1.1.0.0"
    date: "2026-02-09"
    changes: "Add image size control, image-only floating notifications (transparent, no chrome). Improve center positioning reliability."
  - version: "1.0.5.0"
    date: "2026-02-09"
    changes: "Fix center positioning. Add sound, opacity, and pinned notification features. Add custom image support."
  - version: "1.0.1.0"
    date: "2026-02-09"
    changes: "Initial marketplace submission"
